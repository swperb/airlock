name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The demo integration tests launch the airlock and demo binaries, so
      # build every binary in the workspace before testing.
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      - name: Demo
        if: matrix.os == 'ubuntu-latest'
        run: ./demo/run.sh

  msrv:
    name: minimum supported Rust (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit in the PR is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author_email=$(git show -s --format='%ae' "$sha")
            if ! git show -s --format='%B' "$sha" | grep -qiE "^Signed-off-by: .+ <${author_email}>$"; then
              echo "::error::Commit $sha has no Signed-off-by line matching its author ($author_email). Use 'git commit -s'."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "See CONTRIBUTING.md for how to sign off (git commit -s) or fix existing commits (git rebase --signoff)."
            exit 1
          fi
          echo "All commits are signed off."
